spark.master yarn
spark.submit.deployMode client
spark.driver.host jupyter
spark.driver.bindAddress 0.0.0.0
spark.driver.memory 768m
spark.executor.memory 512m
spark.executor.memoryOverhead 256m
spark.executor.cores 1
spark.executor.instances 2
spark.yarn.am.memory 256m
spark.yarn.am.memoryOverhead 128m
spark.yarn.populateHadoopClasspath true
spark.pyspark.python /usr/local/bin/python3
spark.sql.shuffle.partitions 6
spark.sql.warehouse.dir hdfs://sutran/user/hive/warehouse
